# Save every epoch, keep the last 3 epoch_*.pt. best.pt = min validation loss;
# latest.pt / interrupted.pt are always kept. The paper evaluates the final
# epoch (epoch_0009.pt == latest.pt after a full run).
# @package checkpoint

save_dir: ${oc.env:HOME}/egobabyvlm_experiments/flamingo/${name}/checkpoints
save_every: 1
keep_last: 3
resume_from: null
