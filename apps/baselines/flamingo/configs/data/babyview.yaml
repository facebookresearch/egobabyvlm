# BabyView: (utterance, frame) pairs, one random frame per utterance at train
# time. Shares the BabyView reader with the EgoVLP baseline. Manifests and frames
# are read from $BABYVIEW_ROOT ({train,val}.json, frames/resize_256/frames).
# @package data

dataset:
  _target_: apps.baselines.flamingo.data.build_flamingo_babyview
  manifest_train: ${oc.env:BABYVIEW_ROOT}/train.json
  manifest_val: ${oc.env:BABYVIEW_ROOT}/val.json
  image_root: ${oc.env:BABYVIEW_ROOT}/frames/resize_256/frames
  prompt_template: "<image> {text}"
  max_length: 64
  media_token: ${model.media_token}
  on_load_error: skip        # skip + log unreadable images; abort after max_load_failures
  max_load_failures: 100

batch_size: 32
val_batch_size: 32
num_workers: 8
pin_memory: true
augment: false
image_size: 224
