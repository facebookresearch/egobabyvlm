# AdamW, lr 1e-4 with per-step cosine decay to 0 and no warmup. Weight decay 0.01
# with a param-group split: gate scalars, all 1-D params (LayerNorm/biases), and
# Perceiver latents/time_pos_emb get wd=0.
# @package optim

lr: 1.0e-4
weight_decay: 0.01
betas: [0.9, 0.999]
eps: 1.0e-8
min_lr_ratio: 0.0
grad_clip: 1.0
split_weight_decay: true
